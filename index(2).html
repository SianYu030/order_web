<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#355b48">
  <title>線上報修系統</title>
  <style>
    :root{--green:#3f6f56;--green2:#e6f0ea;--red:#d9534f;--amber:#d99a20;--ink:#25332b;--muted:#6d766f;--line:#d9dfda;--bg:#eef1ed;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    button,input,select,textarea{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;padding:0 12px 110px}
    header{position:sticky;top:0;z-index:10;margin:0 -12px 14px;padding:14px 16px;background:var(--green);color:#fff;box-shadow:0 2px 10px #0002}
    header h1{font-size:21px;margin:0}header p{font-size:13px;margin:4px 0 0;opacity:.85}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #263a2c0b}
    .title{font-weight:800;margin:0 0 10px;font-size:16px}.req{color:var(--red)}
    select,input[type=text],textarea{width:100%;border:1px solid #cbd3cd;border-radius:10px;background:#fff;padding:12px;color:var(--ink);outline:none}
    textarea{min-height:105px;resize:vertical}select:focus,input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #3f6f5620}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.machines{grid-template-columns:repeat(2,1fr)}
    .choice{min-height:52px;border:1px solid #d4dbd6;border-radius:10px;background:#f4f6f4;color:#35483c;padding:9px 7px;font-weight:700;line-height:1.25}
    .choice.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 8px #31553f35}
    .choice.danger.active{background:var(--red);border-color:var(--red)}.choice.warning.active{background:var(--amber);border-color:var(--amber)}
    .hint{color:var(--muted);font-size:13px;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .photo{display:block;border:1.5px dashed #aeb9b1;border-radius:10px;padding:14px;text-align:center;background:#f8faf8;color:var(--green);font-weight:700;cursor:pointer}.photo input{display:none}
    #preview{display:none;width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:10px;background:#eee}
    .query{display:flex;gap:8px}.query input{flex:1}.smallBtn{border:0;border-radius:10px;background:#e7ebe8;color:#34473a;padding:0 14px;font-weight:800}
    .summary{display:none;background:#f4f8f5;border-radius:10px;padding:10px;font-size:14px;line-height:1.7;margin-top:10px}
    .submitbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#ffffffef;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))}
    .submit{display:block;width:min(656px,calc(100vw - 24px));margin:auto;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:900;font-size:18px;padding:15px}
    .submit:disabled{opacity:.55}.status{text-align:center;font-size:13px;margin:7px 0 0;color:var(--muted)}
    .hidden{display:none}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--green2);color:var(--green);font-size:12px;font-weight:800}
    @media(max-width:390px){.app{padding-left:9px;padding-right:9px}.grid{gap:6px}.choice{font-size:14px;padding:8px 4px}.machines{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="app">
  <header><h1>🔧 線上報修系統</h1><p>選擇部門與機台，快速送出維修需求</p></header>

  <section class="card">
    <div class="title">查詢／修改報修單</div>
    <div class="query"><input id="queryId" type="text" placeholder="例如：MR20260722001"><button class="smallBtn" onclick="queryOrder()">查詢</button></div>
    <div id="queryResult" class="summary"></div>
  </section>

  <section class="card">
    <div class="title">報修人 <span class="req">*</span></div>
    <select id="reporter"><option value="">請選擇報修人</option></select>
  </section>

  <section class="card">
    <div class="title">部門 <span class="req">*</span></div>
    <div id="departments" class="grid"></div>
  </section>

  <section id="machineCard" class="card hidden">
    <div class="title"><span id="machineTitle">機台</span> <span class="req">*</span></div>
    <div id="machines" class="grid machines"></div>
    <p class="hint">若清單沒有，請選「現場人員臨時需求以及特殊作業」。</p>
  </section>

  <section class="card">
    <div class="title">目前是否停機 <span class="req">*</span></div>
    <div class="row"><button class="choice danger" data-group="stopped" data-value="是">是，已停機</button><button class="choice" data-group="stopped" data-value="否">否，可運轉</button></div>
  </section>

  <section class="card">
    <div class="title">機台異常／作業需求描述 <span class="req">*</span></div>
    <textarea id="description" placeholder="請簡單說明發生什麼狀況，例如：封邊時膠鍋不加熱、機台顯示錯誤碼……"></textarea>
  </section>

  <section class="card">
    <div class="title">緊急程度 <span class="req">*</span></div>
    <div class="grid"><button class="choice" data-group="urgency" data-value="一般">🟢 一般</button><button class="choice warning" data-group="urgency" data-value="緊急">🟡 緊急</button><button class="choice danger" data-group="urgency" data-value="停線">🔴 停線</button></div>
  </section>

  <section class="card">
    <div class="title">故障照片 <span class="tag">選填</span></div>
    <label class="photo">📷 拍照或選擇照片<input id="photo" type="file" accept="image/*" capture="environment"></label>
    <img id="preview" alt="照片預覽">
  </section>

  <section class="card">
    <div class="title">LINE 通知</div>
    <label><input id="lineNotify" type="checkbox" checked> 送出後發送 LINE 維修通知</label>
  </section>
</main>

<div class="submitbar"><button id="submitBtn" class="submit" onclick="submitRepair()">送出報修</button><p id="status" class="status">請確認必填欄位均已完成</p></div>

<script>
  // 下一階段會把 Apps Script 網址填在這裡
  const API_URL = '';
  const reporters = ['王川茂','郭泓倫','李灌音','鍾政良','許竣凱','薛凱澤','方珪翔','張志雲','張育齊','楊添志','蘇育德','王顯籲'];
  const machineData = {
    'E3':['裁板機330','裁板機380','直線封邊機','斜背封邊機','窄邊封邊機','異型封邊機','門板鉸鍊機','E3 集塵機','CNC','立洗機(手工門區)','銑溝機(1號)(手工門區)','銑溝機(2號)(手工門區)','銑溝機(3號)(手工門區)','引孔機(手工門區)','750導洗機(鋁框區)','自動鋁切機(鋁框區)','角度切割機(鋁框區)','現場人員臨時需求以及特殊作業'],
    'E4':['裁板機330','裁板機380','直線封邊機(1號機)','直線封邊機(2號機)','直線封邊機(3號機)','Nesting10號 X1&X2','Nesting20號 X1&X2','六面鑽母機','六面鑽工作站(1號)','六面鑽工作站(2號)','六面鑽工作站(3號)','六面鑽工作站(4號)','ABD側孔機','CNC','集塵機(1號)','集塵機(2號)','電動拖板車(3號)','現場人員臨時需求以及特殊作業'],
    'E5':['鋁切機(五金區)','分板機(五金區)','分條機(五金區)','沖孔機(五金區)','堆棧機1號(板材區)','堆棧機2號(板材區)','堆棧機3號(板材區)','現場人員臨時需求以及特殊作業'],
    'W8':['斜壓裁板機','裁板機330','裁板機380','直線封邊機(1號機)','直線封邊機(2號機)','直線封邊機(3號機)','直線封邊機(4號機)','Nesting10號 X1&X2','Nesting20號 X1&X2','六面鑽母機','六面鑽工作站(1號)','六面鑽工作站(2號)','六面鑽工作站(3號)','六面鑽工作站(4號)','ABD側孔機','CNC','集塵機(1號)','集塵機(2號)','現場人員臨時需求以及特殊作業'],
    '組立區':['SCM組立機1號','SCM組立機2號','嘉吉自動包膜機1號','嘉吉自動包膜機2號','嘉吉低床型自動打包機1號','嘉吉低床型自動打包機2號','自動打包機(小)','SAWSTOP-10英吋移動式圓鋸機','現場人員臨時特殊作業需求'],
    '空壓機室':['空壓機(1號)','空壓機(2號)','乾燥機(1號)','乾燥機(2號)','抽水機(1號)','抽水機(2號)','抽水機(3號)','抽水機(4號)','現場人員臨時特殊作業需求']
  };
  const state={department:'',machine:'',stopped:'',urgency:'',editingId:''};

  function init(){
    reporters.forEach(n=>document.querySelector('#reporter').add(new Option(n,n)));
    Object.keys(machineData).forEach(d=>{
      const b=document.createElement('button'); b.className='choice'; b.textContent=d;
      b.onclick=()=>selectDepartment(d,b); document.querySelector('#departments').appendChild(b);
    });
    document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>choose(b.dataset.group,b.dataset.value,b));
    document.querySelector('#photo').onchange=e=>{const f=e.target.files[0],p=document.querySelector('#preview');if(f){p.src=URL.createObjectURL(f);p.style.display='block'}else p.style.display='none'};
  }
  function choose(group,value,button){state[group]=value;document.querySelectorAll(`[data-group="${group}"]`).forEach(x=>x.classList.remove('active'));button.classList.add('active')}
  function selectDepartment(dept,button){
    state.department=dept;state.machine='';document.querySelectorAll('#departments .choice').forEach(x=>x.classList.remove('active'));button.classList.add('active');
    document.querySelector('#machineCard').classList.remove('hidden');document.querySelector('#machineTitle').textContent=dept+' 選擇維修機台';
    const box=document.querySelector('#machines');box.innerHTML='';machineData[dept].forEach(m=>{const b=document.createElement('button');b.className='choice';b.textContent=m;b.onclick=()=>{state.machine=m;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')};box.appendChild(b)});
    document.querySelector('#machineCard').scrollIntoView({behavior:'smooth',block:'center'});
  }
  function validate(){
    if(!reporter.value)return '請選擇報修人';if(!state.department)return '請選擇部門';if(!state.machine)return '請選擇維修機台';if(!state.stopped)return '請選擇是否停機';if(!description.value.trim())return '請填寫異常或需求描述';if(!state.urgency)return '請選擇緊急程度';return '';
  }
  function makeId(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return 'MR'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+String(Date.now()).slice(-5)}
  async function submitRepair(){
    const error=validate();if(error){alert(error);return}
    const btn=document.querySelector('#submitBtn'),status=document.querySelector('#status');btn.disabled=true;status.textContent='正在送出…';
    const data={action:state.editingId?'update':'create',repairId:state.editingId||makeId(),timestamp:new Date().toLocaleString('zh-TW'),reporter:reporter.value,department:state.department,machine:state.machine,stopped:state.stopped,description:description.value.trim(),urgency:state.urgency,lineNotify:lineNotify.checked};
    try{
      if(API_URL){await fetch(API_URL,{method:'POST',body:JSON.stringify(data)});}else{const all=JSON.parse(localStorage.getItem('repairs')||'[]'),i=all.findIndex(x=>x.repairId===data.repairId);i>=0?all[i]=data:all.unshift(data);localStorage.setItem('repairs',JSON.stringify(all));}
      alert(`報修成功！\n報修單號：${data.repairId}\n請記下此單號方便後續查詢。`);status.textContent='已成功送出：'+data.repairId;state.editingId=data.repairId;btn.textContent='更新報修內容';
    }catch(e){alert('送出失敗，請稍後再試。');status.textContent='送出失敗：'+e.message}
    finally{btn.disabled=false}
  }
  function queryOrder(){
    const id=queryId.value.trim();if(!id){alert('請輸入報修單號');return}
    const all=JSON.parse(localStorage.getItem('repairs')||'[]'),x=all.find(r=>r.repairId===id),box=document.querySelector('#queryResult');box.style.display='block';
    if(!x){box.innerHTML='找不到此報修單。<br><span class="hint">目前測試版只能查詢這台裝置送出的測試紀錄。</span>';return}
    box.innerHTML=`<b>${x.repairId}</b><br>${x.reporter}｜${x.department}｜${x.machine}<br>${x.urgency}｜停機：${x.stopped}<br>${x.description}<br><button class="smallBtn" style="padding:8px 12px;margin-top:6px" onclick="loadOrder('${x.repairId}')">載入修改</button>`;
  }
  function loadOrder(id){const x=JSON.parse(localStorage.getItem('repairs')||'[]').find(r=>r.repairId===id);if(!x)return;state.editingId=id;reporter.value=x.reporter;[...departments.children].find(b=>b.textContent===x.department)?.click();[...machines.children].find(b=>b.textContent===x.machine)?.click();[...document.querySelectorAll('[data-group="stopped"]')].find(b=>b.dataset.value===x.stopped)?.click();description.value=x.description;[...document.querySelectorAll('[data-group="urgency"]')].find(b=>b.dataset.value===x.urgency)?.click();submitBtn.textContent='更新報修內容';window.scrollTo({top:0,behavior:'smooth'})}
  init();
</script>
</body>
</html>
