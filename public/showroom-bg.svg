<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1e7da"/><stop offset="1" stop-color="#dfc8ad"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6a3f22"/><stop offset=".45" stop-color="#9a6740"/><stop offset="1" stop-color="#5a321b"/></linearGradient>
  <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b77c4b"/><stop offset="1" stop-color="#82502e"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7dac9"/><stop offset="1" stop-color="#cdb89f"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8c4ad"/><stop offset="1" stop-color="#c4a98a"/></linearGradient>
  <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="url(#wood)"/><path d="M0 8h40M0 24h40" stroke="#fff" stroke-opacity=".035"/><path d="M8 0v40M31 0v40" stroke="#2d160b" stroke-opacity=".07"/></pattern>
  <pattern id="slats" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="16" height="28" fill="#724324"/><rect x="16" width="6" height="28" fill="#b57a49"/><rect x="22" width="6" height="28" fill="#4d2916"/></pattern>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3d2416" flood-opacity=".25"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
