<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<defs>
  <linearGradient id="woodA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5bd82"/><stop offset=".55" stop-color="#b67842"/><stop offset="1" stop-color="#7b4727"/></linearGradient>
  <linearGradient id="woodB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d29f"/><stop offset="1" stop-color="#a76736"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f2f2"/><stop offset=".22" stop-color="#8e8e8e"/><stop offset=".55" stop-color="#d5d5d5"/><stop offset="1" stop-color="#525252"/></linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b7b7b"/><stop offset="1" stop-color="#262626"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff6a63"/><stop offset=".48" stop-color="#e33834"/><stop offset="1" stop-color="#9d1518"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bd27b"/><stop offset="1" stop-color="#2b8f46"/></linearGradient>
  <filter id="s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#51321e" flood-opacity=".25"/></filter>
  <filter id="s2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#2b1a10" flood-opacity=".28"/></filter>
</defs>

<!-- 1 board stack -->
