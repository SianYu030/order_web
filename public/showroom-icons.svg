  <g transform="rotate(-42 83 90)"><rect x="74" y="25" width="18" height="125" rx="9" fill="url(#darkMetal)"/><rect x="73" y="127" width="20" height="45" rx="8" fill="url(#woodA)"/><circle cx="83" cy="32" r="17" fill="none" stroke="url(#metal)" stroke-width="12"/></g>
