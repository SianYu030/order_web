  <path d="M25 48l88-31 62 23-89 33z" fill="url(#woodB)"/><path d="M25 48v20l61 23v-18z" fill="#c8874a"/><path d="M86 73v18l89-34V40z" fill="#95572e"/>
  <path d="M34 45l77-27M48 50l77-27M44 75l77-27M41 103l77-27" stroke="#fff" stroke-opacity=".28"/></g>
</g>

<!-- 2 nesting boards -->
