<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>設備維修附件｜V3.3 連線測試</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f5f8fc;color:#203b51;margin:0;padding:18px;line-height:1.6}
  main{max-width:640px;margin:30px auto;padding:24px;border:1px solid #ceddea;border-radius:16px;background:white}
  h1{font-size:21px;margin:0 0 10px}
  p{margin:12px 0}
  label{font-weight:700;display:block;margin:18px 0 8px}
  input{width:100%;padding:13px;border:1px solid #a9c6dc;border-radius:9px;font-size:15px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{min-height:44px;padding:10px 18px;border:0;border-radius:9px;background:#27608d;color:white;font-weight:700;cursor:pointer}
  button.secondary{background:#fff;color:#27608d;border:1px solid #27608d}
  button:disabled{opacity:.45;cursor:not-allowed}
  .notice{padding:12px;border:1px solid #e7d39d;background:#fffaf0;border-radius:9px}
  .muted{color:#526678;font-size:13px}
  #status{border:1px solid #c6d9e8;background:#f3f9fd;border-radius:9px;padding:13px;margin-top:18px;overflow-wrap:anywhere}
  #status[data-state="success"]{background:#ecf7ed;border-color:#a8d5b2;color:#125e35}
  #steps{color:#526678;font-size:13px;margin-top:10px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Google Drive V3.3 接收器連線測試</h1>
<p class="notice">這裡只測接收器的跨視窗通訊和 Google Drive 唯讀健康檢查，<strong>不建立 MR 工單、不上傳檔案、不發送 LINE</strong>。</p>
<p>已取消員工識別碼及附件授權碼。測試網址會由專用連結自動帶入，只需要按一次連接。請使用具專案編輯權限的廠務室 Google 帳號。</p>
<form id="configForm">
<label id="devUrlLabel" for="devUrl">Google Apps Script 測試網址（結尾必須是 /dev）</label>
<input id="devUrl" type="url" placeholder="https://script.google.com/macros/s/…/dev" required autocomplete="off" spellcheck="false">
<div class="actions">
<button id="connectBtn" type="submit">開始連線測試</button>
</div>
</form>
<div id="status" role="status" aria-live="polite">尚未開始連線測試。</div>
<div id="steps">測試網址會由專用連結自動帶入，連接後自動執行健康檢查。</div>
<p class="muted">這個頁面不會修改原本的正式報修網站，也不會將 /dev 測試網址寫入公開原始碼。連線成功不代表照片、影片或 NAS 備份已完成。</p>
</main>
<script src="./repair-drive-test.js?v=20261111-v33-oneclick" defer></script>
</body>
</html>
