<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封邊標籤高速辨識測試</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#14212b;background:#f3f6f8}
*{box-sizing:border-box} body{margin:0;padding:16px;background:#f3f6f8}
.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h1{font-size:23px;margin:0 0 8px}.muted{color:#667681;line-height:1.55;font-size:14px}
.capture{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:14px;background:#145da0;color:#fff;font-weight:800;font-size:19px;cursor:pointer}
.capture input{display:none}.status{margin-top:12px;padding:12px;border-radius:12px;background:#eef4f8;font-weight:700;line-height:1.5}
.grid{display:grid;gap:10px}.result{padding:13px;border:1px solid #d6dee4;border-radius:12px}.result b{display:block;font-size:14px;color:#60717c;margin-bottom:4px}.value{font-size:21px;font-weight:850;word-break:break-all}
.ok{background:#edf8ef;border-color:#badfc0}.warn{background:#fff7df;border-color:#e7d28f}
.timing{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}
#preview{width:100%;border-radius:12px;margin-top:12px;display:none}
.small{font-size:13px;color:#667681;margin-top:8px;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:800}
.secondary{width:100%;background:#e7eef3;color:#18323f;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>封邊標籤高速辨識測試</h1>
    <div class="muted">只抓 3 個欄位：QR碼、單號、B碼。OCR 模型會在背景先預熱，拍照後優先快速判讀；資料不足才做第 2 次補強。</div>
    <label class="capture">📸 拍標籤測試
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <div id="status" class="status">背景載入 OCR 中…</div>
    <img id="preview" alt="preview">
    <button id="clearBtn" class="secondary" type="button">清除結果</button>
  </div>

  <div class="card grid">
    <div id="qrBox" class="result"><b>QR碼</b><div id="qr" class="value">－</div></div>
    <div id="orderBox" class="result"><b>單號</b><div id="order" class="value">－</div></div>
    <div id="bBox" class="result"><b>B碼</b><div id="bcode" class="value">－</div></div>
  </div>

  <div class="card">
    <b>速度紀錄</b>
    <div id="timing" class="timing">尚未測試</div>
    <div class="small">建議拍攝：標籤盡量佔畫面 60% 以上、避免反光、手機停穩再拍。稍微斜拍可接受；過度傾斜仍會影響 OCR。</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let workerPromise = null;

function now(){ return performance.now(); }
function ms(v){ return (v/1000).toFixed(2) + ' 秒'; }

async function warmWorker(){
  if (!workerPromise) {
    workerPromise = Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          $('status').textContent = 'OCR 預熱／辨識 ' + Math.round((m.progress||0)*100) + '%';
        }
      }
    }).then(async w => {
      try {
        await w.setParameters({
          tessedit_pageseg_mode:'6',
          preserve_interword_spaces:'1',
          tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-_'
        });
      } catch(e) {}
      $('status').textContent = '✅ OCR 已預熱，可直接拍照';
      return w;
    }).catch(err => {
      workerPromise = null;
      $('status').textContent = '⚠️ OCR 載入失敗，請重新整理';
      throw err;
    });
  }
  return workerPromise;
}
window.addEventListener('load', () => {
  if ('requestIdleCallback' in window) requestIdleCallback(() => warmWorker());
  else setTimeout(() => warmWorker(), 200);
});

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片讀取失敗'))};
    img.src=url;
  });
}

function makeCanvas(img,maxWidth=1600,mode='contrast'){
  const scale=Math.min(1,maxWidth/img.naturalWidth);
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  if(mode){
    const im=ctx.getImageData(0,0,w,h), d=im.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let v;
      if(mode==='binary') v=y>158?255:0;
      else v=Math.max(0,Math.min(255,(y-128)*1.55+128));
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
  }
  return c;
}

function decodeJsQr(canvas){
  try{
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const im=ctx.getImageData(0,0,canvas.width,canvas.height);
    const r=jsQR(im.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
    return r && r.data ? r.data.trim() : '';
  }catch(e){return ''}
}

function cropQrCanvas(img, rx, ry, rw, rh, targetWidth, mode){
  const sx=Math.max(0,Math.round(img.naturalWidth*rx));
  const sy=Math.max(0,Math.round(img.naturalHeight*ry));
  const sw=Math.min(img.naturalWidth-sx,Math.round(img.naturalWidth*rw));
  const sh=Math.min(img.naturalHeight-sy,Math.round(img.naturalHeight*rh));
  const scale=Math.max(1,targetWidth/sw);
  const w=Math.max(1,Math.round(sw*scale));
  const h=Math.max(1,Math.round(sh*scale));
  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);

  if(mode){
    const im=ctx.getImageData(0,0,w,h), d=im.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let v=y;
      if(mode==='contrast') v=Math.max(0,Math.min(255,(y-128)*1.8+128));
      if(mode==='binary') v=y>150?255:0;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
  }
  return c;
}

async function decodeQr(img){
  if ('BarcodeDetector' in window){
    try{
      const bd=new BarcodeDetector({formats:['qr_code']});
      const hits=await bd.detect(img);
      if(hits && hits[0] && hits[0].rawValue) return hits[0].rawValue.trim();
    }catch(e){}
  }

  // 1. 先掃整張，成功就立即返回。
  let c=makeCanvas(img,1700,null);
  let q=decodeJsQr(c);
  if(q) return q;

  c=makeCanvas(img,1900,'contrast');
  q=decodeJsQr(c);
  if(q) return q;

  // 2. 標籤 QR 通常位於中下區；切小區域後放大，避免 QR 在整張照片中太小。
  const regions=[
    [0.18,0.28,0.64,0.62],
    [0.08,0.38,0.84,0.58],
    [0.25,0.35,0.50,0.48],
    [0.00,0.28,0.60,0.65],
    [0.40,0.28,0.60,0.65]
  ];
  for(const r of regions){
    c=cropQrCanvas(img,r[0],r[1],r[2],r[3],1500,'contrast');
    q=decodeJsQr(c);
    if(q) return q;
  }

  // 3. 最後只對最可能區域做黑白強化，不讓正常照片多等太久。
  const finalRegions=[
    [0.18,0.32,0.64,0.58],
    [0.05,0.45,0.90,0.50]
  ];
  for(const r of finalRegions){
    c=cropQrCanvas(img,r[0],r[1],r[2],r[3],1600,'binary');
    q=decodeJsQr(c);
    if(q) return q;
  }
  return '';
}

function normalizeText(s){
  return String(s||'')
    .toUpperCase()
    .replace(/[|]/g,'I')
    .replace(/[ＯO](?=\d)/g,'0')
    .replace(/[ＳS](?=\d)/g,'5');
}

function parseFields(text){
  const raw=normalizeText(text);
  const compact=raw.replace(/\s+/g,' ');
  const tokens=compact.match(/[A-Z0-9_-]{5,}/g)||[];

  let order='';
  let bcode='';

  const orderLabel=raw.match(/(?:單號|ORDER|ORD)\s*[:：#-]?\s*([0-9]{10,16})/i);
  if(orderLabel) order=orderLabel[1];
  if(!order){
    const nums=tokens.map(x=>x.replace(/[^0-9]/g,'')).filter(x=>/^20\d{10,14}$/.test(x));
    if(nums.length) order=nums.sort((a,b)=>b.length-a.length)[0];
  }
  if(!order){
    const m=raw.match(/\b(20\d{10,14})\b/);
    if(m) order=m[1];
  }

  const bm=raw.match(/\bB\s*[-:]?\s*([0-9]{8,12})\b/i);
  if(bm) bcode='B'+bm[1];
  if(!bcode){
    const btoken=tokens.find(x=>/^B[0-9]{8,12}$/.test(x.replace(/[-_]/g,'')));
    if(btoken) bcode=btoken.replace(/[-_]/g,'');
  }
  return {order,bcode,raw};
}

async function ocrPass(worker,canvas,psm='6'){
  try{await worker.setParameters({tessedit_pageseg_mode:psm});}catch(e){}
  const r=await worker.recognize(canvas);
  return r && r.data ? r.data.text||'' : '';
}

function setBox(boxId,val){
  const box=$(boxId);
  box.classList.remove('ok','warn');
  box.classList.add(val ? 'ok' : 'warn');
}

function reset(){
  $('qr').textContent='－'; $('order').textContent='－'; $('bcode').textContent='－';
  ['qrBox','orderBox','bBox'].forEach(id=>{$(id).classList.remove('ok','warn')});
  $('timing').textContent='尚未測試';
  $('preview').style.display='none';
  $('preview').src='';
}

$('clearBtn').addEventListener('click',reset);

$('photo').addEventListener('change', async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  reset();
  const t0=now();
  $('status').textContent='📷 讀取照片…';
  try{
    const img=await loadImage(file);
    const t1=now();
    $('preview').src=URL.createObjectURL(file);
    $('preview').style.display='block';

    $('status').textContent='🔍 QR + 文字快速辨識…';
    const worker=await warmWorker();
    const tWarm=now();

    const qrPromise=decodeQr(img);
    const quickCanvas=makeCanvas(img,1500,'contrast');
    const ocrPromise=ocrPass(worker,quickCanvas,'6');

    const [qr,text1]=await Promise.all([qrPromise,ocrPromise]);
    const t2=now();
    let fields=parseFields(text1);
    let text2='';
    let usedSecond=false;

    if(!fields.order || !fields.bcode){
      usedSecond=true;
      $('status').textContent='⚡ 缺少欄位，補強辨識一次…';
      const c2=makeCanvas(img,1850,'binary');
      text2=await ocrPass(worker,c2,'6');
      const f2=parseFields(text1+'\n'+text2);
      fields.order=fields.order||f2.order;
      fields.bcode=fields.bcode||f2.bcode;
    }
    const t3=now();

    $('qr').textContent=qr||'未讀到';
    $('order').textContent=fields.order||'未讀到';
    $('bcode').textContent=fields.bcode||'未讀到';
    setBox('qrBox',qr);setBox('orderBox',fields.order);setBox('bBox',fields.bcode);

    const all=!!qr&&!!fields.order&&!!fields.bcode;
    $('status').textContent=all?'✅ QR碼、單號、B碼都已辨識':'⚠️ 有欄位未讀到，請確認或重拍';

    $('timing').textContent =
      '照片讀取：' + ms(t1-t0) + '\n' +
      'OCR 預熱等待：' + ms(tWarm-t1) + '\n' +
      'QR + 第1輪 OCR：' + ms(t2-tWarm) + '\n' +
      (usedSecond ? '第2輪補強 OCR：' + ms(t3-t2) + '\n' : '') +
      '總耗時：' + ms(t3-t0) + '\n' +
      '原圖尺寸：' + img.naturalWidth + ' × ' + img.naturalHeight;
  }catch(err){
    $('status').textContent='❌ '+(err&&err.message?err.message:'辨識失敗');
  }finally{
    e.target.value='';
  }
});
</script>
</body>
</html>
