<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封邊標籤穩定辨識測試 v5</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#14212b;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f6f8}
.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h1{font-size:23px;margin:0 0 8px}.muted{color:#667681;line-height:1.55;font-size:14px}
.capture{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:14px;background:#145da0;color:#fff;font-weight:800;font-size:19px;cursor:pointer}
.capture input{display:none}.status{margin-top:12px;padding:12px;border-radius:12px;background:#eef4f8;font-weight:700;line-height:1.5}
.grid{display:grid;gap:10px}.result{padding:13px;border:1px solid #d6dee4;border-radius:12px}.result b{display:block;font-size:14px;color:#60717c;margin-bottom:4px}.value{font-size:21px;font-weight:850;word-break:break-all}
.ok{background:#edf8ef;border-color:#badfc0}.warn{background:#fff7df;border-color:#e7d28f}
.timing{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}
#preview{width:100%;border-radius:12px;margin-top:12px;display:none;border:1px solid #d7dfe5}
.small{font-size:13px;color:#667681;margin-top:8px;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:800}
.secondary{width:100%;background:#e7eef3;color:#18323f;margin-top:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f5;font-size:12px;font-weight:800;margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>封邊標籤穩定辨識測試 v5</h1>
    <div class="muted">流程：自動找到白色標籤 → 自動轉正 → 固定讀單號區、B碼區、QR區。只在缺資料時才跑備援。</div>
    <label class="capture">📸 拍標籤測試
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <div id="status" class="status">背景載入 OCR 中…</div>
    <div id="locBadge" class="badge">尚未定位標籤</div>
    <img id="preview" alt="normalized label">
    <button id="clearBtn" class="secondary" type="button">清除結果</button>
  </div>

  <div class="card grid">
    <div id="qrBox" class="result"><b>QR碼</b><div id="qr" class="value">－</div></div>
    <div id="orderBox" class="result"><b>單號</b><div id="order" class="value">－</div></div>
    <div id="bBox" class="result"><b>B碼</b><div id="bcode" class="value">－</div></div>
  </div>

  <div class="card">
    <b>速度／穩定度紀錄</b>
    <div id="timing" class="timing">尚未測試</div>
    <div class="small">拍攝不必完全正上方，但請讓整張白色標籤都在畫面內。系統會先找標籤並轉正，再讀固定欄位。</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let workerPromise=null;
const now=()=>performance.now();
const sec=v=>(v/1000).toFixed(2)+' 秒';

async function warmWorker(){
  if(!workerPromise){
    workerPromise=Tesseract.createWorker('eng',1,{
      logger:m=>{
        if(m.status==='recognizing text'){
          $('status').textContent='OCR 載入／辨識 '+Math.round((m.progress||0)*100)+'%';
        }
      }
    }).then(async w=>{
      try{await w.setParameters({preserve_interword_spaces:'1'});}catch(e){}
      $('status').textContent='✅ OCR 已預熱，可直接拍照';
      return w;
    }).catch(e=>{
      workerPromise=null;
      $('status').textContent='⚠️ OCR 載入失敗，請重新整理';
      throw e;
    });
  }
  return workerPromise;
}
window.addEventListener('load',()=>{
  if('requestIdleCallback' in window) requestIdleCallback(()=>warmWorker());
  else setTimeout(()=>warmWorker(),150);
});

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片讀取失敗'))};
    img.src=url;
  });
}

function otsu(gray){
  const hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i++)hist[gray[i]]++;
  let total=gray.length,sum=0;
  for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=-1,threshold=160;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB)continue;
    const wF=total-wB; if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){maxVar=v;threshold=t;}
  }
  return threshold;
}

function normalizeLabel(img){
  const maxW=480;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  const gray=new Uint8Array(w*h);
  let mean=0;
  for(let p=0,i=0;p<gray.length;p++,i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    gray[p]=g;mean+=g;
  }
  mean/=gray.length;
  let th=otsu(gray);
  th=Math.max(145,Math.min(220,Math.max(th,mean+8)));

  const mask=new Uint8Array(w*h);
  for(let i=0;i<gray.length;i++) if(gray[i]>=th) mask[i]=1;
  const seen=new Uint8Array(w*h);
  const stack=new Int32Array(w*h);
  let best=null,bestScore=0;
  const total=w*h;

  for(let seed=0;seed<mask.length;seed++){
    if(!mask[seed]||seen[seed])continue;
    let sp=0;stack[sp++]=seed;seen[seed]=1;
    let area=0,minx=w,maxx=0,miny=h,maxy=0;
    let sx=0,sy=0,sxx=0,syy=0,sxy=0;
    const pix=[];
    while(sp){
      const idx=stack[--sp], y=(idx/w)|0, x=idx-y*w;
      area++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;
      pix.push(idx);
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      let n;
      if(x>0){n=idx-1;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(x<w-1){n=idx+1;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(y>0){n=idx-w;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(y<h-1){n=idx+w;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
    }
    const bw=maxx-minx+1,bh=maxy-miny+1,ratio=bw/bh,fill=area/(bw*bh),frac=area/total;
    if(frac<0.035||frac>0.72||ratio<1.12||ratio>2.25||fill<0.40)continue;
    const aspectScore=1-Math.min(1,Math.abs(ratio-1.50)/0.9);
    const score=area*fill*(0.65+0.35*aspectScore);
    if(score>bestScore){
      bestScore=score;
      best={area,minx,maxx,miny,maxy,sx,sy,sxx,syy,sxy,pix,ratio,fill,th};
    }
  }

  if(!best){
    const out=document.createElement('canvas');
    const ow=1600,oh=Math.round(ow*img.naturalHeight/img.naturalWidth);
    out.width=ow;out.height=oh;
    out.getContext('2d').drawImage(img,0,0,ow,oh);
    return {canvas:out,located:false,angle:0,threshold:th};
  }

  const n=best.area,cx=best.sx/n,cy=best.sy/n;
  const cxx=best.sxx/n-cx*cx,cyy=best.syy/n-cy*cy,cxy=best.sxy/n-cx*cy;
  let ang=0.5*Math.atan2(2*cxy,cxx-cyy);
  if(ang>Math.PI/4)ang-=Math.PI/2;
  if(ang<-Math.PI/4)ang+=Math.PI/2;
  const ca=Math.cos(ang),sa=Math.sin(ang);
  let minLX=1e9,maxLX=-1e9,minLY=1e9,maxLY=-1e9;
  for(const idx of best.pix){
    const y=(idx/w)|0,x=idx-y*w,dx=x-cx,dy=y-cy;
    const lx=ca*dx+sa*dy,ly=-sa*dx+ca*dy;
    if(lx<minLX)minLX=lx;if(lx>maxLX)maxLX=lx;
    if(ly<minLY)minLY=ly;if(ly>maxLY)maxLY=ly;
  }
  const marginX=(maxLX-minLX)*0.025,marginY=(maxLY-minLY)*0.035;
  minLX-=marginX;maxLX+=marginX;minLY-=marginY;maxLY+=marginY;

  const inv=1/scale;
  const cxO=cx*inv,cyO=cy*inv,minXO=minLX*inv,maxXO=maxLX*inv,minYO=minLY*inv,maxYO=maxLY*inv;
  const localW=maxXO-minXO,localH=maxYO-minYO;
  const outW=1600,outH=Math.max(650,Math.round(outW*localH/localW));
  const out=document.createElement('canvas');out.width=outW;out.height=outH;
  const o=out.getContext('2d',{willReadFrequently:true});
  o.fillStyle='#fff';o.fillRect(0,0,outW,outH);
  const s=outW/localW;
  o.setTransform(
    s*ca,-s*sa,
    s*sa,s*ca,
    s*(-ca*cxO-sa*cyO-minXO),
    s*(sa*cxO-ca*cyO-minYO)
  );
  o.drawImage(img,0,0);
  o.setTransform(1,0,0,1,0,0);
  return {canvas:out,located:true,angle:ang*180/Math.PI,threshold:th};
}

function cropNorm(src,rx,ry,rw,rh,targetW=900,mode='contrast'){
  const sx=Math.max(0,Math.round(src.width*rx)),sy=Math.max(0,Math.round(src.height*ry));
  const sw=Math.min(src.width-sx,Math.round(src.width*rw)),sh=Math.min(src.height-sy,Math.round(src.height*rh));
  const scale=targetW/sw,w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  if(mode){
    const im=ctx.getImageData(0,0,w,h),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let v=y;
      if(mode==='contrast')v=Math.max(0,Math.min(255,(y-128)*1.6+128));
      if(mode==='binary')v=y>150?255:0;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
  }
  return c;
}

function decodeJsQr(canvas){
  try{
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const im=ctx.getImageData(0,0,canvas.width,canvas.height);
    const r=jsQR(im.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
    return r&&r.data?r.data.trim():'';
  }catch(e){return ''}
}

async function ocr(worker,canvas,whitelist,psm='7'){
  try{
    await worker.setParameters({
      tessedit_pageseg_mode:psm,
      tessedit_char_whitelist:whitelist,
      preserve_interword_spaces:'1'
    });
  }catch(e){}
  const r=await worker.recognize(canvas);
  return {
    text:r&&r.data?r.data.text||'':'',
    confidence:r&&r.data&&typeof r.data.confidence==='number'?r.data.confidence:0
  };
}

function parseOrder(s){
  // 現場單號固定以 20 開頭、共 12 碼；嚴格格式可避免吃到其他尺寸/日期數字。
  const t=String(s||'').replace(/[^0-9]/g,'');
  const m=t.match(/20\d{10}/);
  return m?m[0]:'';
}
function parseB(s){
  // 現場 B碼固定為 B + 9 位數。即使 OCR 尾端多吃到其他數字，也只取正確長度。
  const t=String(s||'').toUpperCase().replace(/[^B0-9]/g,'');
  const m=t.match(/B\d{9}/);
  return m?m[0]:'';
}
function parseQrHuman(s){
  const a=(String(s||'').match(/\d{7,10}/g)||[]);
  const eight=a.find(x=>x.length===8);
  return eight||a[0]||'';
}

async function readAll(worker,label){
  let qr='',qrSource='';
  const qrRegion=cropNorm(label,0.32,0.43,0.37,0.42,1000,null);
  qr=decodeJsQr(qrRegion);
  if(!qr){
    const q2=cropNorm(label,0.27,0.36,0.48,0.50,1200,'contrast');
    qr=decodeJsQr(q2);
  }
  if(qr)qrSource='QR圖形';

  // 頂端欄位改成精準窄區域：左上單號、上方偏中 B碼。
  // 避免右側 ER3078 / 尺寸數字被 OCR 一起吃進去。
  const orderRegions=[
    cropNorm(label,0.005,0.000,0.36,0.105,1200,'contrast'),
    cropNorm(label,0.015,0.008,0.40,0.125,1200,'binary')
  ];
  const bRegions=[
    cropNorm(label,0.34,0.000,0.26,0.105,1050,'contrast'),
    cropNorm(label,0.31,0.005,0.31,0.125,1050,'binary')
  ];

  let order='',orderConf=0,orderRaw='';
  for(const region of orderRegions){
    const rr=await ocr(worker,region,'0123456789',7);
    orderRaw += '\n'+rr.text;
    if(rr.confidence>orderConf) orderConf=rr.confidence;
    order=parseOrder(orderRaw);
    if(order) break;
  }

  let bcode='',bConf=0,bRaw='';
  for(const region of bRegions){
    const rr=await ocr(worker,region,'B0123456789',7);
    bRaw += '\n'+rr.text;
    if(rr.confidence>bConf) bConf=rr.confidence;
    bcode=parseB(bRaw);
    if(bcode) break;
  }

  const orderOcr={confidence:orderConf,text:orderRaw};
  const bOcr={confidence:bConf,text:bRaw};

  let qrHuman='',qrHumanConf=0;
  if(!qr){
    const humanRegion=cropNorm(label,0.37,0.67,0.28,0.15,900,'contrast');
    const human=await ocr(worker,humanRegion,'0123456789',7);
    qrHuman=parseQrHuman(human.text);qrHumanConf=human.confidence;
    if(qrHuman){qr=qrHuman;qrSource='QR下方數字';}
  }

  // 只有缺欄位才掃較寬的頂部備援，避免每張都多跑。
  let fallbackUsed=false;
  if(!order||!bcode){
    fallbackUsed=true;

    // 單號備援：只讀左上更窄區域，做兩種二值化/排版模式。
    if(!order){
      const orderWide=cropNorm(label,0.0,0.0,0.46,0.16,1500,'contrast');
      const rr=await ocr(worker,orderWide,'0123456789',6);
      order=parseOrder(rr.text);
      orderConf=Math.max(orderConf,rr.confidence||0);
    }

    // B碼備援：只讀上方中央，不再掃到右側直排文字。
    if(!bcode){
      const bWide=cropNorm(label,0.28,0.0,0.36,0.16,1300,'contrast');
      const rr=await ocr(worker,bWide,'B0123456789',6);
      bcode=parseB(rr.text);
      bConf=Math.max(bConf,rr.confidence||0);
    }
  }

  return {
    qr,order,bcode,qrSource,fallbackUsed,
    confidence:{order:orderConf,bcode:bConf,qrHuman:qrHumanConf}
  };
}

function setResult(boxId,id,val){
  $(id).textContent=val||'未讀到';
  $(boxId).classList.remove('ok','warn');
  $(boxId).classList.add(val?'ok':'warn');
}
function reset(){
  setResult('qrBox','qr','');setResult('orderBox','order','');setResult('bBox','bcode','');
  $('qr').textContent='－';$('order').textContent='－';$('bcode').textContent='－';
  ['qrBox','orderBox','bBox'].forEach(id=>$(id).classList.remove('ok','warn'));
  $('preview').style.display='none';$('preview').src='';
  $('timing').textContent='尚未測試';$('locBadge').textContent='尚未定位標籤';
}
$('clearBtn').addEventListener('click',reset);

$('photo').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  reset();const t0=now();
  try{
    $('status').textContent='📷 讀取照片…';
    const img=await loadImage(file);const t1=now();

    $('status').textContent='⬜ 自動找標籤並轉正…';
    const norm=normalizeLabel(img);const t2=now();
    $('locBadge').textContent=norm.located
      ? '✅ 已鎖定標籤｜自動校正 '+Math.abs(norm.angle).toFixed(1)+'°'
      : '⚠️ 未鎖定標籤｜使用整張照片備援';

    $('preview').src=norm.canvas.toDataURL('image/jpeg',0.86);
    $('preview').style.display='block';

    const worker=await warmWorker();const t3=now();
    $('status').textContent='🔍 讀取 QR碼、單號、B碼…';
    const data=await readAll(worker,norm.canvas);const t4=now();

    setResult('qrBox','qr',data.qr);
    setResult('orderBox','order',data.order);
    setResult('bBox','bcode',data.bcode);

    const all=!!data.qr&&!!data.order&&!!data.bcode;
    $('status').textContent=all
      ? '✅ QR碼、單號、B碼都已辨識'
      : '⚠️ 有欄位未讀到；系統已做備援，建議再拍一張比較穩定度';

    $('timing').textContent=
      '照片讀取：'+sec(t1-t0)+'\n'+
      '標籤定位＋轉正：'+sec(t2-t1)+'\n'+
      'OCR 預熱等待：'+sec(t3-t2)+'\n'+
      '三欄辨識：'+sec(t4-t3)+'\n'+
      '總耗時：'+sec(t4-t0)+'\n'+
      '標籤定位：'+(norm.located?'成功':'備援')+'\n'+
      '校正角度：'+norm.angle.toFixed(1)+'°\n'+
      'QR來源：'+(data.qrSource||'未讀到')+'\n'+
      '單號信心：'+Math.round(data.confidence.order)+'%\n'+
      'B碼信心：'+Math.round(data.confidence.bcode)+'%\n'+
      (data.fallbackUsed?'頂部備援：有啟動\n':'頂部備援：未啟動\n');
  }catch(err){
    $('status').textContent='❌ '+(err&&err.message?err.message:'辨識失敗');
  }finally{e.target.value='';}
});
</script>
</body>
</html>
