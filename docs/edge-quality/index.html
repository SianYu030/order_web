<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封邊標籤辨識｜正式版</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#14212b;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f6f8}
.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h1{font-size:23px;margin:0 0 8px}.muted{color:#667681;line-height:1.55;font-size:14px}
.capture{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:14px;background:#145da0;color:#fff;font-weight:800;font-size:19px;cursor:pointer}
.capture input{display:none}.status{margin-top:12px;padding:12px;border-radius:12px;background:#eef4f8;font-weight:700;line-height:1.5}
.grid{display:grid;gap:10px}.result{padding:13px;border:1px solid #d6dee4;border-radius:12px}.result b{display:block;font-size:14px;color:#60717c;margin-bottom:4px}.value{font-size:21px;font-weight:850;word-break:break-all}
.ok{background:#edf8ef;border-color:#badfc0}.warn{background:#fff7df;border-color:#e7d28f}
.timing{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}
#preview{width:100%;border-radius:12px;margin-top:12px;display:none;border:1px solid #d7dfe5}
.small{font-size:13px;color:#667681;margin-top:8px;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:800}
.secondary{width:100%;background:#e7eef3;color:#18323f;margin-top:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f5;font-size:12px;font-weight:800;margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>封邊標籤辨識</h1>
    <div class="muted">流程：優先用 QR 四角當定位錨點 → 推算整張標籤 → 透視拉正 → 固定讀單號、B碼。特別強化遠拍與斜拍。</div>
    <label class="capture">📸 拍標籤辨識
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <div id="status" class="status">背景載入 OCR 中…</div>
    <div id="locBadge" class="badge">尚未定位標籤</div>
    <img id="preview" alt="normalized label">
    <button id="clearBtn" class="secondary" type="button">清除結果</button>
  </div>

  <div class="card grid">
    <div id="qrBox" class="result"><b>QR碼</b><div id="qr" class="value">－</div></div>
    <div id="orderBox" class="result"><b>單號</b><div id="order" class="value">－</div></div>
    <div id="bBox" class="result"><b>B碼</b><div id="bcode" class="value">－</div></div>
  </div>

  <div class="card">
    <b>速度／穩定度紀錄</b>
    <div id="timing" class="timing">尚未測試</div>
    <div class="small">拍攝不必完全正上方，但請讓整張白色標籤都在畫面內。系統會先找標籤並轉正，再讀固定欄位。</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let workerPromise=null;
const now=()=>performance.now();
const sec=v=>(v/1000).toFixed(2)+' 秒';

async function warmWorker(){
  if(!workerPromise){
    workerPromise=Tesseract.createWorker('eng',1,{
      logger:m=>{
        if(m.status==='recognizing text'){
          $('status').textContent='OCR 載入／辨識 '+Math.round((m.progress||0)*100)+'%';
        }
      }
    }).then(async w=>{
      try{await w.setParameters({preserve_interword_spaces:'1'});}catch(e){}
      $('status').textContent='✅ OCR 已預熱，可直接拍照';
      return w;
    }).catch(e=>{
      workerPromise=null;
      $('status').textContent='⚠️ OCR 載入失敗，請重新整理';
      throw e;
    });
  }
  return workerPromise;
}
window.addEventListener('load',()=>{
  if('requestIdleCallback' in window) requestIdleCallback(()=>warmWorker());
  else setTimeout(()=>warmWorker(),150);
});

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片讀取失敗'))};
    img.src=url;
  });
}

function otsu(gray){
  const hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i++)hist[gray[i]]++;
  let total=gray.length,sum=0;
  for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=-1,threshold=160;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB)continue;
    const wF=total-wB; if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){maxVar=v;threshold=t;}
  }
  return threshold;
}

function dist(a,b){
  const dx=a.x-b.x,dy=a.y-b.y;
  return Math.hypot(dx,dy);
}

function affineForTriangle(s0,s1,s2,d0,d1,d2){
  const det=s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);
  if(Math.abs(det)<1e-8) return null;
  const a=(d0.x*(s1.y-s2.y)+d1.x*(s2.y-s0.y)+d2.x*(s0.y-s1.y))/det;
  const c=(d0.x*(s2.x-s1.x)+d1.x*(s0.x-s2.x)+d2.x*(s1.x-s0.x))/det;
  const e=(d0.x*(s1.x*s2.y-s2.x*s1.y)+d1.x*(s2.x*s0.y-s0.x*s2.y)+d2.x*(s0.x*s1.y-s1.x*s0.y))/det;
  const b=(d0.y*(s1.y-s2.y)+d1.y*(s2.y-s0.y)+d2.y*(s0.y-s1.y))/det;
  const d=(d0.y*(s2.x-s1.x)+d1.y*(s0.x-s2.x)+d2.y*(s1.x-s0.x))/det;
  const f=(d0.y*(s1.x*s2.y-s2.x*s1.y)+d1.y*(s2.x*s0.y-s0.x*s2.y)+d2.y*(s0.x*s1.y-s1.x*s0.y))/det;
  return {a,b,c,d,e,f};
}

function drawMappedTriangle(ctx,img,s0,s1,s2,d0,d1,d2){
  const m=affineForTriangle(s0,s1,s2,d0,d1,d2);
  if(!m)return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0.x,d0.y);ctx.lineTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();
  ctx.clip();
  ctx.setTransform(m.a,m.b,m.c,m.d,m.e,m.f);
  ctx.drawImage(img,0,0);
  ctx.restore();
}

function bilerp(tl,tr,br,bl,u,v){
  return {
    x:(1-u)*(1-v)*tl.x + u*(1-v)*tr.x + u*v*br.x + (1-u)*v*bl.x,
    y:(1-u)*(1-v)*tl.y + u*(1-v)*tr.y + u*v*br.y + (1-u)*v*bl.y
  };
}

function warpQuad(img,quad,outW){
  const [tl,tr,br,bl]=quad;
  const top=dist(tl,tr),bottom=dist(bl,br),left=dist(tl,bl),right=dist(tr,br);
  const aspect=((top+bottom)/2)/Math.max(1,(left+right)/2);
  const safeAspect=Math.max(1.05,Math.min(2.25,aspect));
  const outH=Math.max(650,Math.round(outW/safeAspect));
  const out=document.createElement('canvas');out.width=outW;out.height=outH;
  const ctx=out.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,outW,outH);

  // 用細網格做透視近似，比單純旋轉更能處理斜拍梯形。
  const cols=10,rows=7;
  for(let j=0;j<rows;j++){
    const v0=j/rows,v1=(j+1)/rows;
    for(let i=0;i<cols;i++){
      const u0=i/cols,u1=(i+1)/cols;
      const s00=bilerp(tl,tr,br,bl,u0,v0);
      const s10=bilerp(tl,tr,br,bl,u1,v0);
      const s11=bilerp(tl,tr,br,bl,u1,v1);
      const s01=bilerp(tl,tr,br,bl,u0,v1);
      const d00={x:u0*outW,y:v0*outH},d10={x:u1*outW,y:v0*outH};
      const d11={x:u1*outW,y:v1*outH},d01={x:u0*outW,y:v1*outH};
      drawMappedTriangle(ctx,img,s00,s10,s11,d00,d10,d11);
      drawMappedTriangle(ctx,img,s00,s11,s01,d00,d11,d01);
    }
  }
  return {canvas:out,aspect:safeAspect};
}

function normalizeLabel(img){
  // v6：小標籤/遠拍也要能鎖定，所以分析寬度提高、最小面積門檻降低。
  const maxW=640;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  const gray=new Uint8Array(w*h);
  let mean=0;
  for(let p=0,i=0;p<gray.length;p++,i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    gray[p]=g;mean+=g;
  }
  mean/=gray.length;
  let th=otsu(gray);
  th=Math.max(135,Math.min(225,Math.max(th,mean+5)));

  const mask=new Uint8Array(w*h);
  for(let i=0;i<gray.length;i++) if(gray[i]>=th) mask[i]=1;
  const seen=new Uint8Array(w*h);
  const stack=new Int32Array(w*h);
  let best=null,bestScore=0;
  const total=w*h;

  for(let seed=0;seed<mask.length;seed++){
    if(!mask[seed]||seen[seed])continue;
    let sp=0;stack[sp++]=seed;seen[seed]=1;
    let area=0,minx=w,maxx=0,miny=h,maxy=0;
    const pix=[];
    while(sp){
      const idx=stack[--sp],y=(idx/w)|0,x=idx-y*w;
      area++;pix.push(idx);
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      let n;
      if(x>0){n=idx-1;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(x<w-1){n=idx+1;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(y>0){n=idx-w;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
      if(y<h-1){n=idx+w;if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
    }
    const bw=maxx-minx+1,bh=maxy-miny+1,ratio=bw/Math.max(1,bh),fill=area/(bw*bh),frac=area/total;

    // 遠拍時標籤可能只佔畫面 0.5~3%，舊版 3.5% 門檻會直接漏掉。
    if(frac<0.0045||frac>0.72||ratio<0.90||ratio>2.70||fill<0.24)continue;
    const aspectScore=1-Math.min(1,Math.abs(ratio-1.45)/1.15);
    const centerX=(minx+maxx)/2/w,centerY=(miny+maxy)/2/h;
    const centerPenalty=Math.min(0.35,Math.hypot(centerX-.5,centerY-.5)*0.25);
    const score=area*fill*(0.72+0.28*aspectScore)*(1-centerPenalty);
    if(score>bestScore){bestScore=score;best={area,minx,maxx,miny,maxy,pix,ratio,fill,th};}
  }

  if(!best){
    const out=document.createElement('canvas');
    const ow=1600,oh=Math.round(ow*img.naturalHeight/img.naturalWidth);
    out.width=ow;out.height=oh;
    out.getContext('2d').drawImage(img,0,0,ow,oh);
    return {canvas:out,located:false,angle:0,perspective:false,threshold:th};
  }

  // 用亮色標籤元件的四個對角極值找四角。
  let tl=null,tr=null,br=null,bl=null;
  let minSum=1e9,maxSum=-1e9,minDiff=1e9,maxDiff=-1e9;
  for(const idx of best.pix){
    const y=(idx/w)|0,x=idx-y*w,s=x+y,dif=x-y;
    if(s<minSum){minSum=s;tl={x,y}}
    if(s>maxSum){maxSum=s;br={x,y}}
    if(dif>maxDiff){maxDiff=dif;tr={x,y}}
    if(dif<minDiff){minDiff=dif;bl={x,y}}
  }

  if(!tl||!tr||!br||!bl){
    const out=document.createElement('canvas');
    out.width=1600;out.height=Math.round(1600*img.naturalHeight/img.naturalWidth);
    out.getContext('2d').drawImage(img,0,0,out.width,out.height);
    return {canvas:out,located:false,angle:0,perspective:false,threshold:th};
  }

  const inv=1/scale;
  let quad=[tl,tr,br,bl].map(p=>({x:p.x*inv,y:p.y*inv}));
  const cx=quad.reduce((s,p)=>s+p.x,0)/4,cy=quad.reduce((s,p)=>s+p.y,0)/4;

  // 往外擴 3%，保留標籤邊緣，避免頂端單號/B碼被裁掉。
  quad=quad.map(p=>({
    x:Math.max(0,Math.min(img.naturalWidth-1,cx+(p.x-cx)*1.035)),
    y:Math.max(0,Math.min(img.naturalHeight-1,cy+(p.y-cy)*1.035))
  }));

  const topAngle=Math.atan2(quad[1].y-quad[0].y,quad[1].x-quad[0].x)*180/Math.PI;
  const warped=warpQuad(img,quad,1600);
  return {
    canvas:warped.canvas,
    located:true,
    angle:topAngle,
    perspective:true,
    threshold:th,
    aspect:warped.aspect
  };
}


function scaledCanvas(img,maxW=1800){
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,w,h);
  return {canvas:c,scale};
}

function decodeJsQrDetailed(canvas){
  try{
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const im=ctx.getImageData(0,0,canvas.width,canvas.height);
    const r=jsQR(im.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
    if(!r||!r.data||!r.location)return null;
    return {data:r.data.trim(),location:r.location};
  }catch(e){return null}
}

function addVec(p,u,ux,v,vy){
  return {x:p.x+u.x*ux+v.x*vy,y:p.y+u.y*ux+v.y*vy};
}

function normalizeByQrAnchor(img){
  // 你的標籤版型固定，且 QR 比白紙邊界更容易在遠拍/斜拍時被穩定抓到。
  // 因此直接利用 QR 四角建立局部座標，再外推整張標籤。
  const sc=scaledCanvas(img,1800);
  let hit=decodeJsQrDetailed(sc.canvas);

  if(!hit){
    // 再做一個對比強化版本。
    const cc=document.createElement('canvas');cc.width=sc.canvas.width;cc.height=sc.canvas.height;
    const ctx=cc.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(sc.canvas,0,0);
    const im=ctx.getImageData(0,0,cc.width,cc.height),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      const v=Math.max(0,Math.min(255,(y-128)*1.55+128));
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
    hit=decodeJsQrDetailed(cc);
  }
  if(!hit)return null;

  const L=hit.location;
  const inv=1/sc.scale;
  const tl={x:L.topLeftCorner.x*inv,y:L.topLeftCorner.y*inv};
  const tr={x:L.topRightCorner.x*inv,y:L.topRightCorner.y*inv};
  const br={x:L.bottomRightCorner.x*inv,y:L.bottomRightCorner.y*inv};
  const bl={x:L.bottomLeftCorner.x*inv,y:L.bottomLeftCorner.y*inv};

  // 取 QR 上下邊、左右邊平均，建立一格 QR 的水平/垂直向量。
  const u={
    x:((tr.x-tl.x)+(br.x-bl.x))/2,
    y:((tr.y-tl.y)+(br.y-bl.y))/2
  };
  const v={
    x:((bl.x-tl.x)+(br.x-tr.x))/2,
    y:((bl.y-tl.y)+(br.y-tr.y))/2
  };

  const qSize=(Math.hypot(u.x,u.y)+Math.hypot(v.x,v.y))/2;
  if(qSize<5)return null;

  // 由現場這款固定標籤版型校正：
  // QR 左上點約位於標籤寬 45%、高 54% 附近。
  // 以 QR 自身寬高作單位向四周外推，可抵抗距離、旋轉與一般斜拍。
  const p0=tl;
  let quad=[
    addVec(p0,u,-3.55,v,-3.05), // label TL
    addVec(p0,u, 4.35,v,-3.05), // label TR
    addVec(p0,u, 4.35,v, 2.65), // label BR
    addVec(p0,u,-3.55,v, 2.65)  // label BL
  ];

  quad=quad.map(p=>({
    x:Math.max(0,Math.min(img.naturalWidth-1,p.x)),
    y:Math.max(0,Math.min(img.naturalHeight-1,p.y))
  }));

  const warped=warpQuad(img,quad,1600);
  const angle=Math.atan2(u.y,u.x)*180/Math.PI;
  return {
    canvas:warped.canvas,
    located:true,
    anchor:'QR',
    angle,
    perspective:true,
    qr:hit.data,
    aspect:warped.aspect
  };
}

function cropNorm(src,rx,ry,rw,rh,targetW=900,mode='contrast'){
  const sx=Math.max(0,Math.round(src.width*rx)),sy=Math.max(0,Math.round(src.height*ry));
  const sw=Math.min(src.width-sx,Math.round(src.width*rw)),sh=Math.min(src.height-sy,Math.round(src.height*rh));
  const scale=targetW/sw,w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  if(mode){
    const im=ctx.getImageData(0,0,w,h),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let v=y;
      if(mode==='contrast')v=Math.max(0,Math.min(255,(y-128)*1.6+128));
      if(mode==='binary')v=y>150?255:0;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
  }
  return c;
}

function decodeJsQr(canvas){
  const r=decodeJsQrDetailed(canvas);
  return r?r.data:'';
}

async function ocr(worker,canvas,whitelist,psm='7'){
  try{
    await worker.setParameters({
      tessedit_pageseg_mode:psm,
      tessedit_char_whitelist:whitelist,
      preserve_interword_spaces:'1'
    });
  }catch(e){}
  const r=await worker.recognize(canvas);
  return {
    text:r&&r.data?r.data.text||'':'',
    confidence:r&&r.data&&typeof r.data.confidence==='number'?r.data.confidence:0
  };
}

function parseOrder(s){
  // 單號固定為 20 開頭、共 12 碼。
  // 不把不同列/不同區塊的數字全部串起來，避免產生假單號。
  const raw=String(s||'').toUpperCase();
  const lines=raw.split(/\r?\n/);

  for(const line of lines){
    const compact=line.replace(/[^0-9]/g,'');
    const m=compact.match(/20\d{10}/);
    if(m) return m[0];
  }

  const tokens=raw.match(/20[0-9\s._-]{10,20}/g)||[];
  for(const token of tokens){
    const digits=token.replace(/[^0-9]/g,'');
    const m=digits.match(/^20\d{10}$/);
    if(m) return m[0];
  }
  return '';
}

function chooseOrderCandidate(items){
  const valid=(items||[])
    .map(x=>({code:parseOrder(x.text),confidence:Number(x.confidence||0)}))
    .filter(x=>/^20\d{10}$/.test(x.code));

  if(!valid.length) return {code:'',confidence:0,votes:0,agreement:0,candidates:[]};

  const groups={};
  for(const x of valid){
    if(!groups[x.code]) groups[x.code]={code:x.code,count:0,score:0,maxConf:0};
    groups[x.code].count++;
    groups[x.code].score += Math.max(15,x.confidence);
    groups[x.code].maxConf=Math.max(groups[x.code].maxConf,x.confidence);
  }

  const ranked=Object.values(groups).sort((a,b)=>
    (b.count-a.count) || (b.score-a.score) || (b.maxConf-a.maxConf)
  );

  let code=ranked[0].code;
  let agreement=ranked[0].count/valid.length;

  // 沒有完整碼共識時，逐位數做加權投票。
  if(ranked[0].count<2 && valid.length>=2){
    let out='';
    let agreeSum=0;
    for(let pos=0;pos<12;pos++){
      const bucket={};
      let total=0;
      for(const x of valid){
        const ch=x.code[pos];
        const w=Math.max(20,x.confidence);
        bucket[ch]=(bucket[ch]||0)+w;
        total+=w;
      }
      const top=Object.entries(bucket).sort((a,b)=>b[1]-a[1])[0];
      out+=top[0];
      agreeSum+=total?top[1]/total:0;
    }
    if(/^20\d{10}$/.test(out)){
      code=out;
      agreement=agreeSum/12;
    }
  }

  const avgConf=valid.reduce((s,x)=>s+x.confidence,0)/valid.length;
  return {
    code,
    confidence:avgConf,
    votes:valid.filter(x=>x.code===code).length,
    agreement,
    candidates:valid.map(x=>x.code)
  };
}
function parseB(s){
  // 現場 B碼固定為 B + 9 位數。
  const t=String(s||'').toUpperCase().replace(/[^B0-9]/g,'');
  const m=t.match(/B\d{9}/);
  return m?m[0]:'';
}

function chooseBCodeCandidate(items){
  // 多個 OCR 版本同時判讀 B碼，避免單次誤把 5/7、0/2、3/8 看錯。
  const valid=(items||[])
    .map(x=>({code:parseB(x.text),confidence:Number(x.confidence||0)}))
    .filter(x=>/^B\d{9}$/.test(x.code));

  if(!valid.length) return {code:'',confidence:0,votes:0,agreement:0,candidates:[]};

  // 先做完整候選碼投票。
  const groups={};
  for(const x of valid){
    if(!groups[x.code]) groups[x.code]={code:x.code,count:0,score:0,maxConf:0};
    groups[x.code].count++;
    groups[x.code].score += Math.max(15,x.confidence);
    groups[x.code].maxConf=Math.max(groups[x.code].maxConf,x.confidence);
  }
  let ranked=Object.values(groups).sort((a,b)=>
    (b.count-a.count) || (b.score-a.score) || (b.maxConf-a.maxConf)
  );

  // 若沒有明顯完整碼共識，再做逐字元加權投票。
  let code=ranked[0].code;
  let votes=ranked[0].count;
  let charAgreement=0;

  if(ranked[0].count<2 && valid.length>=2){
    let out='B';
    let agreeSum=0;
    for(let pos=1;pos<10;pos++){
      const bucket={};
      let total=0;
      for(const x of valid){
        const ch=x.code[pos];
        const w=Math.max(20,x.confidence);
        bucket[ch]=(bucket[ch]||0)+w;
        total+=w;
      }
      const top=Object.entries(bucket).sort((a,b)=>b[1]-a[1])[0];
      out+=top[0];
      agreeSum += total ? top[1]/total : 0;
    }
    const voted=parseB(out);
    if(voted){
      code=voted;
      charAgreement=agreeSum/9;
      votes=valid.filter(x=>x.code===voted).length;
    }
  } else {
    charAgreement=ranked[0].count/valid.length;
  }

  const avgConf=valid.reduce((s,x)=>s+x.confidence,0)/valid.length;
  return {
    code,
    confidence:avgConf,
    votes,
    agreement:charAgreement,
    candidates:valid.map(x=>x.code)
  };
}
function parseQrHuman(s){
  const a=(String(s||'').match(/\d{7,10}/g)||[]);
  const eight=a.find(x=>x.length===8);
  return eight||a[0]||'';
}

async function readAll(worker,label,seedQr='',seedQrSource=''){
  let qr=seedQr||'',qrSource=seedQrSource||'';
  if(!qr){
    const qrRegion=cropNorm(label,0.32,0.43,0.37,0.42,1000,null);
    qr=decodeJsQr(qrRegion);
    if(!qr){
      const q2=cropNorm(label,0.27,0.36,0.48,0.50,1200,'contrast');
      qr=decodeJsQr(q2);
    }
    if(qr)qrSource='QR圖形';
  }

  // 頂端欄位改成精準窄區域：左上單號、上方偏中 B碼。
  // 避免右側 ER3078 / 尺寸數字被 OCR 一起吃進去。
  const orderRegions=[
    cropNorm(label,0.005,0.000,0.36,0.105,1200,'contrast'),
    cropNorm(label,0.015,0.008,0.40,0.125,1200,'binary')
  ];
  // 單號也改成多裁切、多預處理、多 PSM 交叉辨識。
  const orderJobs=[
    {c:cropNorm(label,0.005,0.000,0.34,0.090,1250,null),       psm:7},
    {c:cropNorm(label,0.005,0.000,0.34,0.095,1250,'contrast'), psm:7},
    {c:cropNorm(label,0.000,0.000,0.38,0.110,1350,'binary'),   psm:7},
    {c:cropNorm(label,0.000,0.000,0.40,0.125,1400,'contrast'), psm:6},
    {c:cropNorm(label,0.010,0.005,0.33,0.085,1250,'contrast'), psm:13}
  ];
  const orderReads=[];
  for(const job of orderJobs){
    const rr=await ocr(worker,job.c,'0123456789',job.psm);
    orderReads.push(rr);
  }
  const orderPick=chooseOrderCandidate(orderReads);
  let order=orderPick.code;
  let orderConf=orderPick.confidence;
  let orderRaw=orderReads.map(x=>x.text).join('\n');

  // B碼改成多裁切、多預處理、多 PSM 交叉辨識。
  // 只多掃上方中央這一小塊，速度增加有限，但準確度會比單次 OCR 穩。
  const bJobs=[
    {c:cropNorm(label,0.315,0.000,0.285,0.105,1200,null),       psm:7},
    {c:cropNorm(label,0.315,0.000,0.285,0.105,1200,'contrast'), psm:7},
    {c:cropNorm(label,0.305,0.000,0.315,0.120,1300,'contrast'), psm:6},
    {c:cropNorm(label,0.325,0.005,0.265,0.095,1200,'binary'),   psm:7},
    {c:cropNorm(label,0.285,0.000,0.350,0.135,1350,'contrast'), psm:13}
  ];
  const bReads=[];
  for(const job of bJobs){
    const rr=await ocr(worker,job.c,'B0123456789',job.psm);
    bReads.push(rr);
  }
  const bPick=chooseBCodeCandidate(bReads);
  let bcode=bPick.code;
  let bConf=bPick.confidence;
  let bRaw=bReads.map(x=>x.text).join('\n');

  const orderOcr={confidence:orderConf,text:orderRaw};
  const bOcr={confidence:bConf,text:bRaw};

  let qrHuman='',qrHumanConf=0;
  if(!qr){
    const humanRegion=cropNorm(label,0.37,0.67,0.28,0.15,900,'contrast');
    const human=await ocr(worker,humanRegion,'0123456789',7);
    qrHuman=parseQrHuman(human.text);qrHumanConf=human.confidence;
    if(qrHuman){qr=qrHuman;qrSource='QR下方數字';}
  }

  // 只有缺欄位才掃較寬的頂部備援，避免每張都多跑。
  let fallbackUsed=false;
  if(!order||!bcode){
    fallbackUsed=true;

    // 單號備援：再用兩個更寬的左上區域補票，但不跨列拼接。
    if(!order){
      const extra=[];
      for(const spec of [
        [0.0,0.0,0.42,0.14,1500,'contrast',6],
        [0.0,0.0,0.39,0.12,1450,'binary',7]
      ]){
        const cc=cropNorm(label,spec[0],spec[1],spec[2],spec[3],spec[4],spec[5]);
        extra.push(await ocr(worker,cc,'0123456789',spec[6]));
      }
      const pick=chooseOrderCandidate(extra);
      order=pick.code;
      orderConf=Math.max(orderConf,pick.confidence||0);
    }

    // B碼備援：再用更寬一點的中央區補一票，不掃右側直排文字。
    if(!bcode){
      const extra=[];
      for(const spec of [
        [0.27,0.0,0.38,0.15,1450,'contrast',6],
        [0.29,0.0,0.34,0.13,1400,'binary',7]
      ]){
        const cc=cropNorm(label,spec[0],spec[1],spec[2],spec[3],spec[4],spec[5]);
        extra.push(await ocr(worker,cc,'B0123456789',spec[6]));
      }
      const pick=chooseBCodeCandidate(extra);
      bcode=pick.code;
      bConf=Math.max(bConf,pick.confidence||0);
    }
  }

  return {
    qr,order,bcode,qrSource,fallbackUsed,
    confidence:{order:orderConf,bcode:bConf,qrHuman:qrHumanConf},
    orderDiagnostics:{votes:orderPick.votes,agreement:orderPick.agreement,candidates:orderPick.candidates},
    bDiagnostics:{votes:bPick.votes,agreement:bPick.agreement,candidates:bPick.candidates}
  };
}

function setResult(boxId,id,val){
  $(id).textContent=val||'未讀到';
  $(boxId).classList.remove('ok','warn');
  $(boxId).classList.add(val?'ok':'warn');
}
function reset(){
  setResult('qrBox','qr','');setResult('orderBox','order','');setResult('bBox','bcode','');
  $('qr').textContent='－';$('order').textContent='－';$('bcode').textContent='－';
  ['qrBox','orderBox','bBox'].forEach(id=>$(id).classList.remove('ok','warn'));
  $('preview').style.display='none';$('preview').src='';
  $('timing').textContent='尚未測試';$('locBadge').textContent='尚未定位標籤';
}
$('clearBtn').addEventListener('click',reset);

$('photo').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  reset();const t0=now();
  try{
    $('status').textContent='📷 讀取照片…';
    const img=await loadImage(file);const t1=now();

    $('status').textContent='🎯 先用 QR 當定位錨點…';
    let norm=normalizeByQrAnchor(img);
    let locateMode='QR錨點';

    if(!norm){
      $('status').textContent='⬜ QR定位失敗，改找白色標籤…';
      norm=normalizeLabel(img);
      locateMode=norm.located?'白色標籤':'整張照片備援';
    }
    const t2=now();

    $('locBadge').textContent=norm.located
      ? '✅ 已鎖定標籤｜'+locateMode+'｜校正 '+Math.abs(norm.angle||0).toFixed(1)+'°'
      : '⚠️ 未鎖定標籤｜使用整張照片備援';

    $('preview').src=norm.canvas.toDataURL('image/jpeg',0.86);
    $('preview').style.display='block';

    const worker=await warmWorker();const t3=now();
    $('status').textContent='🔍 讀取 QR碼、單號、B碼…';
    const data=await readAll(
      worker,
      norm.canvas,
      norm.anchor==='QR' ? norm.qr : '',
      norm.anchor==='QR' ? 'QR錨點' : ''
    );const t4=now();

    setResult('qrBox','qr',data.qr);
    setResult('orderBox','order',data.order);
    setResult('bBox','bcode',data.bcode);

    const all=!!data.qr&&!!data.order&&!!data.bcode;
    $('status').textContent=all
      ? '✅ QR碼、單號、B碼都已辨識'
      : '⚠️ 有欄位未讀到；系統已做備援，建議再拍一張比較穩定度';

    $('timing').textContent=
      '照片讀取：'+sec(t1-t0)+'\n'+
      '定位＋透視拉正：'+sec(t2-t1)+'\n'+
      'OCR 預熱等待：'+sec(t3-t2)+'\n'+
      '三欄辨識：'+sec(t4-t3)+'\n'+
      '總耗時：'+sec(t4-t0)+'\n'+
      '定位方式：'+locateMode+'\n'+
      '校正角度：'+norm.angle.toFixed(1)+'°\n'+
      'QR來源：'+(data.qrSource||'未讀到')+'\n'+
      '單號信心：'+Math.round(data.confidence.order)+'%\n'+
      '單號候選：'+((data.orderDiagnostics&&data.orderDiagnostics.candidates)||[]).join(' / ')+'\n'+
      '單號一致度：'+Math.round(((data.orderDiagnostics&&data.orderDiagnostics.agreement)||0)*100)+'%\n'+
      'B碼信心：'+Math.round(data.confidence.bcode)+'%\n'+
      'B碼候選：'+((data.bDiagnostics&&data.bDiagnostics.candidates)||[]).join(' / ')+'\n'+
      'B碼一致度：'+Math.round(((data.bDiagnostics&&data.bDiagnostics.agreement)||0)*100)+'%\n'+
      (data.fallbackUsed?'頂部備援：有啟動\n':'頂部備援：未啟動\n');
  }catch(err){
    $('status').textContent='❌ '+(err&&err.message?err.message:'辨識失敗');
  }finally{e.target.value='';}
});
</script>
