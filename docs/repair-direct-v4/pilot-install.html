<!DOCTYPE html><html lang="zh-Hant"><meta charset="UTF-8"><title>V4 隔離驗證安裝輔助</title><main style="font-family:system-ui;max-width:640px;margin:40px auto"><h2>V4 隔離測試程式（管理員一次性）</h2><p>只用於已登入的 Apps Script 專案內部測試。測試資料與正式工單分離，完成後必須執行 v4PilotRestore 並刪除暫存程式。此頁面沒有 Google 帳號授權及 Drive 存取。</p><button id="copy" style="font-size:17px;padding:13px">複製隔離測試程式</button><p id="status" role="status">尚未複製</p><textarea readonly style="width:100%;height:100px" id="fallback"></textarea></main><script>const source="/** TEMPORARY staging-only verification. Remove after restoring settings. */\nconst V4_PILOT_MR='MR2026111399';\nfunction v4PilotStart() {\n  const p=PropertiesService.getScriptProperties();\n  if(p.getProperty('V4_PILOT_ACTIVE')) throw new Error('隔離測試已啟用，禁止再次切換');\n  drivePilotConfig_();\n  const fit=DriveApp.getFoldersByName('【V4隔離測試】附件寫入驗證_20261113');\n  if(!fit.hasNext()) throw new Error('找不到隔離測試資料夾');\n  const f=fit.next(); if(fit.hasNext()) throw new Error('重複測試資料夾');\n  const sit=DriveApp.getFilesByName('【V4隔離測試】MR工單清單_20261113');\n  if(!sit.hasNext()) throw new Error('找不到隔離測試工單表');\n  const sf=sit.next(); if(sit.hasNext()) throw new Error('重複測試工單表');\n  const t=SpreadsheetApp.openById(sf.getId()).getSheetByName('機修維修單');\n  if(!t || String(t.getRange('A2').getDisplayValue()).trim()!==V4_PILOT_MR) throw new Error('隔離測試工單不符，拒絕切換');\n  const oldRoot=p.getProperty('REPAIR_ATTACH_ROOT_ID');\n  const oldSheet=p.getProperty('REPAIR_FORMAL_SHEET_ID');\n  if(!oldRoot||!oldSheet||oldRoot===f.getId()||oldSheet===sf.getId()) throw new Error('原始環境不可備份');\n  p.setProperties({V4_PILOT_ORIGINAL_ROOT:oldRoot,V4_PILOT_ORIGINAL_SHEET:oldSheet,V4_PILOT_STAGE_ROOT:f.getId(),V4_PILOT_ACTIVE:'1',REPAIR_ATTACH_ROOT_ID:f.getId(),REPAIR_FORMAL_SHEET_ID:sf.getId()});\n  Logger.log('STAGE_ON: 已隔離，原正式設定安全備份；請以新執行階段測試');\n}\nfunction v4PilotRequire_() {\n const p=PropertiesService.getScriptProperties();\n if(p.getProperty('V4_PILOT_ACTIVE')!=='1'||REPAIR_DRIVE_PILOT.ROOT_FOLDER_ID!==p.getProperty('V4_PILOT_STAGE_ROOT'))\n  throw new Error('非隔離測試狀態，嚴禁測試寫入');\n}\nfunction v4PilotCall_(data){\n const rid=Utilities.getUuid();\n const p=Object.assign({rid},data);\n doPost({parameter:p});\n const r=CacheService.getScriptCache().get('direct_v4_'+rid);\n if(!r)throw new Error('未收到回執 '+data.action);\n return JSON.parse(r);\n}\nfunction v4PilotMissingMr() {\n v4PilotRequire_();\n const r=v4PilotCall_({action:'start',meta:JSON.stringify({orderNo:'MR2026111398',mediaKind:'報修照片',name:'no-mr.png',size:82})});\n if(r.ok||!String(r.error).includes('找不到')) throw new Error('未知工單未被拒絕：'+JSON.stringify(r));\n Logger.log('MISSING_MR_REJECTED: '+r.error);\n}\nfunction v4PilotSend_(kind,name,b64) {\n v4PilotRequire_();\n const bytes=Utilities.base64Decode(b64);\n const a=v4PilotCall_({action:'start',meta:JSON.stringify({orderNo:V4_PILOT_MR,mediaKind:kind,name:name,size:bytes.length})});\n if(!a.ok)throw new Error('START: '+JSON.stringify(a));\n const b=v4PilotCall_({action:'chunk',sessionId:a.result.sessionId,offset:'0',base64:b64});\n if(!b.ok||!b.result.complete)throw new Error('CHUNK: '+JSON.stringify(b));\n const md5=Utilities.computeDigest(Utilities.DigestAlgorithm.MD5,bytes).map(x=>(x&255).toString(16).padStart(2,'0')).join('');\n if(md5!==b.result.md5)throw new Error('Drive MD5 不一致');\n const f=DriveApp.getFileById(b.result.fileId);\n if(f.getSize()!==bytes.length)throw new Error('Drive 檔案大小不一致');\n Logger.log(JSON.stringify({result:'PASS',kind,size:bytes.length,fileId:f.getId(),name:f.getName(),md5}));\n PropertiesService.getScriptProperties().deleteProperty('upload_'+a.result.sessionId);\n}\nfunction v4PilotPhoto() {\n const image='iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAGUlEQVR4nGM02lLBQApgIkn1qIZRDUNKAwBhKgF+HDq4wwAAAABJRU5ErkJggg==';\n v4PilotSend_('報修照片','V4_PILOT_16px.png',image);\n}\nfunction v4PilotVideo() {\n const video='AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMUbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAA estore() {\n const p=PropertiesService.getScriptProperties();\n if(p.getProperty('V4_PILOT_ACTIVE')!=='1')throw new Error('隔離測試尚未啟動或已還原');\n const root=p.getProperty('V4_PILOT_ORIGINAL_ROOT'),sheet=p.getProperty('V4_PILOT_ORIGINAL_SHEET');\n if(!root||!sheet||root===p.getProperty('V4_PILOT_STAGE_ROOT'))throw new Error('找不到原正式設定，拒絕清除備份');\n p.setProperties({REPAIR_ATTACH_ROOT_ID:root,REPAIR_FORMAL_SHEET_ID:sheet});\n p.deleteProperty('V4_PILOT_ACTIVE');\n Logger.log('STAGE_OFF: 原正式 Drive 與 MR 試算表設定均已還原');\n}\n";const a=document.getElementById('fallback');a.value=source;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(source);document.getElementById('status').textContent='已複製 '+source.length+' 字元';}catch(e){a.focus();a.select();document.execCommand('copy');document.getElementById('status').textContent='已使用備援複製，長度 '+source.length;}};</script></html>
