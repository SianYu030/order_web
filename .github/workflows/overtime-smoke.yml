name: Overtime Live Smoke
on:
  push:
    branches: [main]
    paths:
      - 'overtime/**'
      - 'docs/overtime/**'
      - 'integrations/overtime-google/**'
      - 'scripts/overtime-smoke.mjs'
      - 'scripts/overtime-bridge-unit.mjs'
      - '.github/workflows/overtime-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # 01:00 Asia/Taipei, read-only checks
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Static JS syntax check
        run: |
          node --check overtime/overtime-client.js
          node --check overtime/bridge-admin.js
          cp integrations/overtime-google/Code.gs /tmp/overtime-google-bridge.js
          node --check /tmp/overtime-google-bridge.js
      - name: Verify Google worker mapping and read-only safety checks
        run: node scripts/overtime-bridge-unit.mjs
      - name: Verify public webpages, live Edge roster and access control (no real writes)
        run: node scripts/overtime-smoke.mjs
