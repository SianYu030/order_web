name: Apps Script Bridge Diagnostic

on:
  push:
    branches:
      - design/reference-showroom-hd

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Apps Script bridge
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbwCiISmnwpTcsZjgR2Yu2FapMRbxvDt7-pPAFtkqkl9rpfDyK8KgbvV3Y0gf6p4O-d5mQ/exec?api=systems'
          curl -sS -L --max-time 30 -o /tmp/bridge-response.txt \
            -w 'HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nEFFECTIVE_URL=%{url_effective}\n' \
            "$URL"
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/bridge-response.txt', 'utf8');
          console.log(`BODY_BYTES=${Buffer.byteLength(text)}`);
          try {
            const body = JSON.parse(text);
            console.log(`JSON_OK=true`);
            console.log(`SUCCESS_FIELD=${body.success === true}`);
            console.log(`DATA_IS_ARRAY=${Array.isArray(body.data)}`);
            console.log(`DATA_COUNT=${Array.isArray(body.data) ? body.data.length : -1}`);
            if (body.success !== true || !Array.isArray(body.data)) process.exit(2);
          } catch (error) {
            console.log('JSON_OK=false');
            console.log(`LOOKS_LIKE_HTML=${/^\s*</.test(text)}`);
            process.exit(3);
          }
          NODE
